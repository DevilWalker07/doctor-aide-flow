<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Medfluxo</title>
    <script>
      // Aplica o tema antes do React montar. Sem isto, recarregar no escuro
      // pisca uma tela branca inteira — no plantão noturno isso cega.
      (function () {
        try {
          var t = localStorage.getItem("da_tema");
          var escuro =
            t === "dark" ||
            ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) document.documentElement.classList.add("dark");
        } catch (e) {
          /* storage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
