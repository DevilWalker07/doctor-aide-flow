name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - saas-clinical-agents

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://nxnkmgdoyvnifeuaxkdp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder_for_ci
          SUPABASE_URL: https://nxnkmgdoyvnifeuaxkdp.supabase.co
          SUPABASE_PUBLISHABLE_KEY: placeholder_for_ci
