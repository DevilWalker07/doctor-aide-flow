name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate FastAPI app
        run: python -c "import ast; ast.parse(open('services/clinical_agents/app.py').read())"

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Edge functions são mockadas em todos os testes — não precisa de URL real,
          # mas o supabase client falha no boot se essas vars estiverem vazias.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-mock-anon-key
          # Bypassa o auth guard nos testes E2E — evita mockar sessão Supabase
          # (frágil — depende da chave interna do supabase-js). Em prod/dev
          # esse flag é undefined e o guard funciona normal.
          VITE_E2E: "true"
          # Ativa botão Google nos testes auth (que mockam /auth/v1/*). Em
          # prod fica desligado por padrão até o Supabase Dashboard ter o
          # provider configurado.
          VITE_GOOGLE_OAUTH: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
